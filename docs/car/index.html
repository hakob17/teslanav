<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>TeslaNav</title>
<link rel="stylesheet" href="maplibre-gl.css">
<link rel="stylesheet" href="leaflet.css">
<style>
:root{
  --bg:#0d1015;--panel:rgba(19,23,30,.94);--line:#2a313c;--ink:#f2f4f7;--quiet:#9aa4b2;
  --accent:#3e8bff;--ok:#2fbf71;--warn:#f5a524;--bad:#ff5a5f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;
  font:18px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none;
  -webkit-tap-highlight-color:transparent}
#map{position:absolute;inset:0;background:var(--bg)}
.leaflet-container{background:var(--bg);font:inherit}
.dark-tiles{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.85) saturate(.5)}
.leaflet-control-attribution{background:rgba(13,16,21,.7)!important;color:var(--quiet)!important;font-size:11px}
.leaflet-control-attribution a{color:var(--quiet)!important}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink)}
.maplibregl-popup-content{background:var(--panel);color:var(--ink);border-radius:14px;padding:10px}
.maplibregl-popup-tip{border-top-color:var(--panel)!important;border-bottom-color:var(--panel)!important}
.maplibregl-ctrl-attrib{background:rgba(13,16,21,.7)!important;color:var(--quiet)!important;font-size:11px}
.maplibregl-ctrl-attrib a{color:var(--quiet)!important}
.maplibregl-ctrl-attrib-button{filter:invert(1)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 32px rgba(0,0,0,.5)}
button{font:inherit;color:inherit;background:#232a35;border:1px solid var(--line);border-radius:14px;
  min-height:60px;padding:0 22px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:10px}
button:active{filter:brightness(1.3)}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
button.danger{background:#3b1c20;border-color:#5b2a2f;color:#ffc2c4;font-weight:600}
button svg{width:28px;height:28px}
.hidden{display:none!important}
.left{position:absolute;left:16px;width:min(480px,calc(100% - 120px));z-index:1000}

/* search */
#search{top:16px;overflow:hidden}
#chargerPanel{top:16px;bottom:16px;display:flex;flex-direction:column;overflow:hidden}
#chargerPanel header{display:flex;align-items:center;gap:12px;padding:14px 14px 10px 20px}
#chargerPanel header b{flex:1;font-size:22px}
#chargerPanel header button{min-height:48px;padding:0 16px}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:0 20px 12px}
.chip{min-height:44px;padding:0 16px;border-radius:999px;font-size:16px;background:#1b212a}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.chipLabel{width:100%;color:var(--quiet);font-size:14px;margin:2px 0 -2px}
#chargerList{overflow:auto;border-top:1px solid var(--line);flex:1}
#chargerList .res b{display:flex;gap:8px;align-items:center}
.res .conn,.conn{display:inline-block;font-size:13px;font-weight:600;padding:2px 8px;border-radius:6px;background:#1f3a2a;color:#8ee6b0;margin:6px 6px 0 0}
.conn.unknown{background:#2a2f38;color:var(--quiet)}
#searchRow{display:flex;align-items:center}
#searchRow svg{width:28px;height:28px;margin-left:20px;color:var(--quiet);flex:none}
#q{flex:1;min-width:0;height:68px;border:0;background:transparent;color:var(--ink);font:inherit;font-size:22px;padding:0 16px;outline:none}
input[type=search]::-webkit-search-cancel-button{display:none}
#clearQ{min-height:48px;margin-right:10px;padding:0 14px;background:transparent;border:0;color:var(--quiet)}
#results{max-height:62vh;overflow:auto;border-top:1px solid var(--line)}
#results:empty{display:none}
.res{padding:16px 20px;border-bottom:1px solid var(--line);cursor:pointer}
.res:last-child{border-bottom:0}
.res:active{background:#232a35}
.res b{display:block;font-weight:600;font-size:20px}
.res span{display:block;color:var(--quiet);font-size:15px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.res.note{color:var(--quiet);cursor:default}

/* maneuver banner */
#banner{top:16px;display:flex;gap:18px;align-items:center;padding:18px 22px;background:#15345f;border-color:#24508c}
#bIcon{width:84px;height:84px;flex:none;color:#fff}
#bDist{font-size:40px;font-weight:700;line-height:1}
#bText{font-size:22px;margin-top:6px;color:#dbe7ff}
#bThen{margin-top:10px;font-size:16px;color:#a9c4ef;display:flex;align-items:center;gap:8px}
#bThen svg{width:26px;height:26px}

/* trip bar */
#trip{bottom:28px;display:flex;align-items:center;gap:18px;padding:14px 14px 14px 22px}
#tArrive{font-size:34px;font-weight:700;line-height:1}
#tRest{color:var(--quiet);font-size:18px;margin-top:4px}
#trip .grow{flex:1}

/* right column */
#fabs{position:absolute;top:16px;right:16px;z-index:1000;display:flex;flex-direction:column;gap:12px;align-items:flex-end}
#fabs button{width:76px;height:76px;padding:0;border-radius:20px;background:var(--panel)}
#fabs button.label{width:auto;padding:0 20px;font-size:17px;font-weight:600}
#northBtn{font-weight:800;font-size:15px;flex-direction:column;gap:2px}
#northBtn svg{width:30px;height:30px;transition:transform .3s}
#speed{width:88px;height:88px;border-radius:50%;background:var(--panel);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center}
#speed b{font-size:34px;line-height:1}
#speed span{font-size:13px;color:var(--quiet)}
#menu{position:absolute;top:16px;right:108px;z-index:1001;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:280px}
#menu button{justify-content:flex-start;width:100%}

/* status pill + toast */
#status{position:absolute;left:50%;transform:translateX(-50%);bottom:28px;z-index:999;padding:10px 18px;border-radius:999px;font-size:16px;white-space:nowrap}
#status.warn{color:var(--warn)} #status.bad{color:var(--bad)} #status.ok{color:var(--ok)}
body.navigating #status{bottom:130px}
#toast{position:absolute;left:50%;top:24px;transform:translateX(-50%);z-index:3000;padding:14px 22px;font-size:20px;
  transition:opacity .3s;pointer-events:none}

/* car marker */
.car{width:52px;height:52px;display:grid;place-items:center;transition:transform .8s ease-out}
.car svg{width:52px;height:52px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))}
/* MapLibre positions markers with transform itself; animating it makes the car lag behind. */
.car.gl{transition:none}
.dest{width:40px;height:40px}

/* mirror mode */
#mirror{position:fixed;inset:0;z-index:2000;background:#000;display:flex;align-items:center;justify-content:center}
#mirrorCanvas{width:100%;height:100%;display:block}
#mirrorBar{position:absolute;top:16px;right:16px;display:flex;gap:10px;transition:opacity .4s}
#mirrorBar button{background:var(--panel);font-weight:600}
#mirror.idle #mirrorBar{opacity:0;pointer-events:none}
#mirrorHint{position:absolute;max-width:560px;padding:28px;text-align:center;font-size:22px}
#mirrorHint p{color:var(--quiet);font-size:18px;margin:12px 0 0}
#pair{position:fixed;inset:0;z-index:2500;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
#pairBox{width:min(560px,calc(100% - 32px));padding:28px}
#pairBox h2{margin:0 0 8px;font-size:26px}
#pairBox p{color:var(--quiet);margin:0 0 18px}
#pairCode{width:100%;height:72px;font:700 34px/1 ui-monospace,Menlo,monospace;letter-spacing:6px;text-transform:uppercase;text-align:center;
  background:#0d1015;color:var(--ink);border:1px solid var(--line);border-radius:14px;outline:none}
#pairBox .row{display:flex;gap:12px;justify-content:flex-end;margin-top:18px}
</style>
</head>
<body>
<div id="map"></div>

<div id="search" class="panel left">
  <div id="searchRow">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Where to?" autocomplete="off" spellcheck="false">
    <button id="clearQ" class="hidden" aria-label="Clear">✕</button>
  </div>
  <div id="results"></div>
</div>

<div id="chargerPanel" class="panel left hidden">
  <header><b>EV chargers</b><button id="chargerMapBtn"></button><button id="chargerClose" aria-label="Close">✕</button></header>
  <div class="chips" id="connChips"></div>
  <div class="chips" id="opChips"></div>
  <div id="chargerList"></div>
  <div style="padding:8px 20px;font-size:12px;color:var(--quiet);border-top:1px solid var(--line)">Charger data: © OpenStreetMap contributors, Open Charge Map (CC BY 4.0)</div>
</div>

<div id="banner" class="panel left hidden">
  <div id="bIcon"></div>
  <div style="min-width:0">
    <div id="bDist"></div>
    <div id="bText"></div>
    <div id="bThen" class="hidden"></div>
  </div>
</div>

<div id="trip" class="panel left hidden">
  <div class="grow">
    <div id="tArrive"></div>
    <div id="tRest"></div>
  </div>
  <button id="overview" aria-label="Route overview">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>
  </button>
  <button id="end" class="danger">End</button>
</div>

<div id="fabs">
  <div id="speed" class="hidden"><b>0</b><span>km/h</span></div>
  <button id="northBtn" class="hidden" aria-label="Heading up or north up"></button>
  <button id="recenter" class="hidden" aria-label="Recenter">
    <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l7 19-7-4-7 4z"/></svg>
  </button>
  <button id="chargersFab" class="label">⚡ Chargers</button>
  <button id="mirrorBtn" class="label">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="6" y="2" width="12" height="20" rx="3"/><path d="M10 18h4"/></svg>
    Phone screen
  </button>
  <button id="menuBtn" aria-label="Menu">
    <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2.2"/><circle cx="12" cy="12" r="2.2"/><circle cx="19" cy="12" r="2.2"/></svg>
  </button>
</div>

<div id="menu" class="panel hidden">
  <button id="voiceBtn"></button>
  <button id="testVoice">Test voice</button>
  <button id="styleBtn"></button>
  <button id="engineBtn"></button>

  <button id="simBtn">Simulate drive</button>
  <button id="pairBtn">📱  Phone code</button>
</div>

<div id="status" class="panel hidden"></div>
<div id="toast" class="panel" style="opacity:0"></div>

<div id="mirror" class="hidden">
  <canvas id="mirrorCanvas"></canvas>
  <div id="mirrorHint" class="panel">
    <span id="mirrorHintTitle">Connecting…</span>
    <p>On the iPhone, open TeslaNav and tap <b>Start Broadcast</b>, then switch to Yandex, Google Maps or Waze.</p>
  </div>
  <div id="mirrorBar">
    <button id="fitBtn"></button>
    <button id="fullBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      Full screen
    </button>
    <button id="mirrorBack">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M9 4L3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14"/></svg>
      Map
    </button>
  </div>
</div>

<div id="pair" class="hidden">
  <div id="pairBox" class="panel">
    <h2>Pair with your iPhone</h2>
    <p>Enter the 8-character code shown in the TeslaNav app on your iPhone.</p>
    <input id="pairCode" maxlength="9" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="XXXX-XXXX">
    <div class="row"><button id="pairCancel">Cancel</button><button id="pairOk" class="primary">Connect</button></div>
  </div>
</div>

<script src="maplibre-gl.js"></script>
<script src="leaflet.js"></script>
<script>
(() => {
'use strict';

// ---------------------------------------------------------------- helpers
const $ = id => document.getElementById(id);
const show = (el, on) => el.classList.toggle('hidden', !on);
const store = {
  get(k, d) { try { const v = localStorage.getItem('tn.' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('tn.' + k, JSON.stringify(v)); } catch {} },
};
async function fetchT(url, ms) {
  const ctl = new AbortController();
  const t = setTimeout(() => ctl.abort(), ms);
  try { return await fetch(url, { signal: ctl.signal, cache: 'no-store' }); } finally { clearTimeout(t); }
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let toastTimer;
function toast(msg, ms = 3000) {
  const el = $('toast');
  el.textContent = msg; el.style.opacity = 1;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.style.opacity = 0, ms);
}
function setStatus(msg, kind) {
  const el = $('status');
  show(el, !!msg); el.textContent = msg || ''; el.className = 'panel ' + (kind || '') + (msg ? '' : ' hidden');
}

// ---------------------------------------------------------------- geo
const R = 6371008.8, rad = d => d * Math.PI / 180, deg = r => r * 180 / Math.PI;
function dist(a, b) {
  const dLat = rad(b.lat - a.lat), dLng = rad(b.lng - a.lng);
  const s = Math.sin(dLat / 2) ** 2 + Math.cos(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(s));
}
function bearing(a, b) {
  const y = Math.sin(rad(b.lng - a.lng)) * Math.cos(rad(b.lat));
  const x = Math.cos(rad(a.lat)) * Math.sin(rad(b.lat)) - Math.sin(rad(a.lat)) * Math.cos(rad(b.lat)) * Math.cos(rad(b.lng - a.lng));
  return (deg(Math.atan2(y, x)) + 360) % 360;
}
/** Nearest point on segment a–b to p, in local metres: {t, d}. */
function projSeg(p, a, b) {
  const my = R * Math.PI / 180, mx = my * Math.cos(rad(p.lat));
  const ax = (a.lng - p.lng) * mx, ay = (a.lat - p.lat) * my, bx = (b.lng - p.lng) * mx, by = (b.lat - p.lat) * my;
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
  const t = l2 ? Math.max(0, Math.min(1, -(ax * dx + ay * dy) / l2)) : 0;
  return { t, d: Math.hypot(ax + t * dx, ay + t * dy) };
}
function fmtDist(m) {
  if (m >= 10000) return Math.round(m / 1000) + ' km';
  if (m >= 1000) return (m / 1000).toFixed(1) + ' km';
  if (m >= 100) return Math.round(m / 50) * 50 + ' m';
  return Math.max(0, Math.round(m / 10) * 10) + ' m';
}
function spokenDist(m) {
  if (m >= 1000) { const km = Math.round(m / 100) / 10; return km === 1 ? '1 kilometer' : km + ' kilometers'; }
  return Math.max(50, Math.round(m / 50) * 50) + ' meters';
}
function fmtDuration(s) {
  const min = Math.max(1, Math.round(s / 60));
  return min < 60 ? min + ' min' : Math.floor(min / 60) + ' h ' + (min % 60) + ' min';
}

// ---------------------------------------------------------------- map
// Two engines behind one small interface (M): a vector map drawn with MapLibre (sharp at
// every zoom, can rotate heading-up and tilt), and the older Leaflet raster map as a
// fallback for browsers without WebGL or when chosen in the menu.
const params = new URLSearchParams(location.search);
const saved = store.get('view', { lat: 20, lng: 0, z: 3 });
const CAR_SVG = '<svg viewBox="0 0 52 52"><circle cx="26" cy="26" r="22" fill="#3e8bff" stroke="#fff" stroke-width="4"/><path d="M26 12l10 24-10-6-10 6z" fill="#fff"/></svg>';
const DEST_SVG = '<svg class="dest" viewBox="0 0 40 40"><path d="M20 38s13-13 13-22a13 13 0 0 0-26 0c0 9 13 22 13 22z" fill="#ff5a5f" stroke="#fff" stroke-width="2.5"/><circle cx="20" cy="16" r="5" fill="#fff"/></svg>';

function hasWebGL() {
  try { const c = document.createElement('canvas'); return !!(c.getContext('webgl2') || c.getContext('webgl')); }
  catch { return false; }
}
const engine = store.get('engine', 'vector') === 'vector' && window.maplibregl && hasWebGL() ? 'vector' : 'classic';

/** A circle of `r` metres around p as a GeoJSON ring (for the GPS accuracy halo). */
function circleRing(p, r) {
  const pts = [], dLat = r / 111320, dLng = r / (111320 * Math.cos(rad(p.lat)));
  for (let i = 0; i <= 48; i++) { const a = i / 48 * 2 * Math.PI; pts.push([p.lng + dLng * Math.cos(a), p.lat + dLat * Math.sin(a)]); }
  return pts;
}

function vectorMap() {
  const STYLES = {
    night: { name: 'Night', url: 'https://tiles.openfreemap.org/styles/dark' },
    day: { name: 'Day', url: 'https://tiles.openfreemap.org/styles/liberty' },
  };
  let styleKey = STYLES[store.get('vstyle')] ? store.get('vstyle') : 'night';
  const map = new maplibregl.Map({
    container: 'map', style: STYLES[styleKey].url, center: [saved.lng, saved.lat], zoom: saved.z,
    attributionControl: { compact: true }, dragRotate: true, pitchWithRotate: true, maxPitch: 60,
  });
  const empty = { type: 'FeatureCollection', features: [] };
  let routeData = empty, accData = empty;

  // Route and GPS halo live in the style, so they're re-added whenever the style changes.
  function addOverlays() {
    if (map.getSource('route')) return;
    map.addSource('route', { type: 'geojson', data: routeData });
    map.addSource('acc', { type: 'geojson', data: accData });
    map.addLayer({ id: 'acc', type: 'fill', source: 'acc', paint: { 'fill-color': '#3e8bff', 'fill-opacity': 0.12 } });
    map.addLayer({ id: 'route-casing', type: 'line', source: 'route', layout: { 'line-join': 'round', 'line-cap': 'round' },
                   paint: { 'line-color': '#0b2a57', 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 7, 16, 16] } });
    map.addLayer({ id: 'route-line', type: 'line', source: 'route', layout: { 'line-join': 'round', 'line-cap': 'round' },
                   paint: { 'line-color': '#3e8bff', 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 4, 16, 9] } });
    map.addSource('chargers', { type: 'geojson', data: chargerData });
    map.addLayer({ id: 'chargers', type: 'circle', source: 'chargers',
                   paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 8, 4, 15, 9], 'circle-color': '#2fbf71',
                            'circle-stroke-color': '#fff', 'circle-stroke-width': 2 } });
  }
  let chargerData = empty, onCharger = null;
  map.on('click', 'chargers', e => { const f = e.features[0]; if (f && onCharger) onCharger(JSON.parse(f.properties.c)); });
  // OpenFreeMap's dark style is very low-contrast; on a car screen in daylight the roads vanish.
  // Lift roads, labels and land a few steps while keeping it a night map.
  const NIGHT = {
    background: ['background-color', '#10141a'],
    water: ['fill-color', '#15263a'], waterway: ['line-color', '#1d3350'],
    landuse_residential: ['fill-color', '#13171d'], landcover_wood: ['fill-color', '#122019'], landuse_park: ['fill-color', '#122019'],
    building: ['fill-color', '#1b212a'],
    highway_path: ['line-color', '#2a3140'], highway_minor: ['line-color', '#3a4353'],
    highway_major_casing: ['line-color', '#262c36'], highway_major_inner: ['line-color', '#5d6879'], highway_major_subtle: ['line-color', '#4a5465'],
    highway_motorway_casing: ['line-color', '#3a2f1c'], highway_motorway_inner: ['line-color', '#9a7b3f'], highway_motorway_subtle: ['line-color', '#6d5a33'],
    'aeroway-runway': ['line-color', '#2c3340'], 'aeroway-taxiway': ['line-color', '#232933'], 'aeroway-area': ['fill-color', '#161b22'],
    railway: ['line-color', '#343a44'], railway_minor: ['line-color', '#2c323b'], railway_transit: ['line-color', '#2c323b'],
    highway_name_other: ['text-color', '#b9c2cf'], highway_name_motorway: ['text-color', '#e0cf9f'], water_name: ['text-color', '#6f8fb5'],
  };
  function tuneNight() {
    if (styleKey !== 'night') return;
    for (const [id, [prop, value]] of Object.entries(NIGHT)) {
      if (map.getLayer(id)) try { map.setPaintProperty(id, prop, value); } catch {}
    }
    for (const l of map.getStyle().layers) {
      if (l.type !== 'symbol') continue;
      if (l.id.startsWith('place_')) try { map.setPaintProperty(l.id, 'text-color', '#d3dae4'); } catch {}
      try { map.setPaintProperty(l.id, 'text-halo-color', '#10141a'); map.setPaintProperty(l.id, 'text-halo-width', 1.4); } catch {}
    }
  }
  // Street labels: the Latin name alone; "ARAM STREET Արամ փողոց" side by side is unreadable at speed.
  function latinStreetLabels() {
    for (const id of ['highway_name_other', 'highway_name_major', 'road_label', 'highway-name-minor', 'highway-name-major']) {
      if (map.getLayer(id)) try {
        map.setLayoutProperty(id, 'text-field', ['coalesce', ['get', 'name:latin'], ['get', 'name_en'], ['get', 'name']]);
      } catch {}
    }
  }
  map.on('style.load', () => { tuneNight(); latinStreetLabels(); addOverlays(); });

  const carEl = document.createElement('div');
  carEl.className = 'car gl'; carEl.innerHTML = CAR_SVG;
  const car = new maplibregl.Marker({ element: carEl, rotationAlignment: 'map', pitchAlignment: 'map' });
  const destEl = document.createElement('div'); destEl.innerHTML = DEST_SVG;
  const destM = new maplibregl.Marker({ element: destEl, anchor: 'bottom' });
  let popup = null;

  // Long press (touch or mouse) → 'longpress'.
  const handlers = {};
  let pressTimer = null, pressAt = null;
  const canvasEl = map.getCanvasContainer();
  canvasEl.addEventListener('pointerdown', e => {
    pressAt = [e.clientX, e.clientY];
    clearTimeout(pressTimer);
    pressTimer = setTimeout(() => {
      const r = map.getContainer().getBoundingClientRect();
      const ll = map.unproject([pressAt[0] - r.left, pressAt[1] - r.top]);
      (handlers.longpress || (() => {}))({ lat: ll.lat, lng: ll.lng });
    }, 650);
  });
  const cancelPress = e => {
    if (e.type === 'pointermove' && pressAt && Math.hypot(e.clientX - pressAt[0], e.clientY - pressAt[1]) < 10) return;
    clearTimeout(pressTimer);
  };
  ['pointerup', 'pointercancel', 'pointermove'].forEach(t => canvasEl.addEventListener(t, cancelPress));

  return {
    kind: 'vector', canRotate: true,
    styleName: () => STYLES[styleKey].name,
    nextStyle() { styleKey = styleKey === 'night' ? 'day' : 'night'; store.set('vstyle', styleKey); map.setStyle(STYLES[styleKey].url); },
    center() { const c = map.getCenter(); return { lat: c.lat, lng: c.lng }; },
    zoom: () => map.getZoom(),
    bearing: () => map.getBearing(),
    setZoom(z) { map.jumpTo({ zoom: z }); },
    /** Instant move. `ahead` shifts the car towards the bottom of the screen (0..0.5). */
    jump(p, { zoom, bearing = 0, pitch = 0, ahead = 0 } = {}) {
      const h = map.getContainer().clientHeight;
      map.jumpTo({ center: [p.lng, p.lat], zoom: zoom ?? map.getZoom(), bearing, pitch,
                   padding: { top: h * ahead * 2, bottom: 0, left: 0, right: 0 } });
    },
    /** North-up follow with the view pushed ahead of the car along `course`. */
    jumpAhead(p, course, frac) {
      const c = map.getContainer(), a = rad(course);
      map.jumpTo({ center: [p.lng, p.lat], bearing: 0, pitch: 0, padding: { top: 0, bottom: 0, left: 0, right: 0 } });
      const pt = map.project([p.lng, p.lat]);
      const ll = map.unproject([pt.x + Math.sin(a) * c.clientWidth * frac, pt.y - Math.cos(a) * c.clientHeight * frac]);
      map.jumpTo({ center: ll });
    },
    fit(points, pad) {
      const b = new maplibregl.LngLatBounds();
      points.forEach(p => b.extend([p.lng, p.lat]));
      map.fitBounds(b, { padding: pad, maxZoom: 17, bearing: 0, pitch: 0, duration: 800 });
    },
    setCar(p, heading) { car.setLngLat([p.lng, p.lat]).setRotation(heading); if (!car._map) car.addTo(map); },
    setAcc(p, r) { accData = { type: 'Feature', geometry: { type: 'Polygon', coordinates: [circleRing(p, r)] } }; map.getSource('acc')?.setData(accData); },
    setRoute(points) {
      routeData = { type: 'Feature', geometry: { type: 'LineString', coordinates: points.map(p => [p.lng, p.lat]) } };
      map.getSource('route')?.setData(routeData);
    },
    clearRoute() { routeData = empty; map.getSource('route')?.setData(empty); },
    setChargers(list, onTap) {
      onCharger = onTap;
      chargerData = { type: 'FeatureCollection', features: list.map(c => ({ type: 'Feature',
        properties: { c: JSON.stringify(c) }, geometry: { type: 'Point', coordinates: [c.lng, c.lat] } })) };
      map.getSource('chargers')?.setData(chargerData);
    },
    setDest(p) { destM.setLngLat([p.lng, p.lat]).addTo(map); },
    clearDest() { destM.remove(); },
    popup(p, el) { popup?.remove(); popup = new maplibregl.Popup({ closeButton: false }).setLngLat([p.lng, p.lat]).setDOMContent(el).addTo(map); },
    closePopup() { popup?.remove(); popup = null; },
    on(ev, fn) {
      if (ev === 'longpress') handlers.longpress = fn;
      else if (ev === 'userMove') ['dragstart', 'rotatestart', 'pitchstart'].forEach(t => map.on(t, e => { if (e.originalEvent) fn(); }));
      else if (ev === 'click') map.on('click', fn);
      else if (ev === 'moveend') map.on('moveend', fn);
    },
  };
}

function classicMap() {
  const map = L.map('map', { zoomControl: false, zoomSnap: 0.5, tap: false }).setView([saved.lat, saved.lng], saved.z);
  // Keyless raster tiles: OpenStreetMap made dark with a CSS filter, or Esri's dark canvas.
  const STYLES = {
    osm: { name: 'OpenStreetMap', layers: [L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 20, maxNativeZoom: 19, className: 'dark-tiles', attribution: '© OpenStreetMap contributors' })] },
    esri: { name: 'Esri dark', layers: [
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 20, maxNativeZoom: 16, attribution: 'Tiles © Esri — Esri, HERE, Garmin, © OpenStreetMap contributors' }),
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Reference/MapServer/tile/{z}/{y}/{x}', {
        maxZoom: 20, maxNativeZoom: 16 })] },
  };
  let styleKey = STYLES[store.get('style')] ? store.get('style') : 'osm';
  STYLES[styleKey].layers.forEach(l => l.addTo(map));
  map.attributionControl.setPrefix(false);

  const carM = L.marker([0, 0], { interactive: false, zIndexOffset: 1000,
    icon: L.divIcon({ className: '', iconSize: [52, 52], iconAnchor: [26, 26], html: '<div class="car">' + CAR_SVG + '</div>' }) });
  const destM = L.marker([0, 0], { interactive: false,
    icon: L.divIcon({ className: '', iconSize: [40, 40], iconAnchor: [20, 38], html: DEST_SVG }) });
  const acc = L.circle([0, 0], { radius: 0, stroke: false, fillColor: '#3e8bff', fillOpacity: 0.12, interactive: false });
  const casing = L.polyline([], { color: '#0b2a57', weight: 14, opacity: 0.9, interactive: false });
  const line = L.polyline([], { color: '#3e8bff', weight: 8, opacity: 1, interactive: false });
  let popup = null;
  const chargerLayer = L.layerGroup().addTo(map);

  return {
    kind: 'classic', canRotate: false,
    styleName: () => STYLES[styleKey].name,
    nextStyle() {
      STYLES[styleKey].layers.forEach(l => l.remove());
      styleKey = styleKey === 'osm' ? 'esri' : 'osm'; store.set('style', styleKey);
      STYLES[styleKey].layers.forEach(l => l.addTo(map));
    },
    center() { const c = map.getCenter(); return { lat: c.lat, lng: c.lng }; },
    zoom: () => map.getZoom(),
    bearing: () => 0,
    setZoom(z) { map.setZoom(z, { animate: false }); },
    jump(p, { zoom } = {}) { map.setView([p.lat, p.lng], zoom ?? map.getZoom(), { animate: false }); },
    jumpAhead(p, course, frac) {
      const z = map.getZoom(), size = map.getSize(), a = rad(course);
      const pt = map.project([p.lat, p.lng], z).add(L.point(Math.sin(a) * size.x * frac, -Math.cos(a) * size.y * frac));
      map.setView(map.unproject(pt, z), z, { animate: false });
    },
    fit(points, pad) {
      map.fitBounds(L.latLngBounds(points.map(p => [p.lat, p.lng])),
        { paddingTopLeft: [pad.left, pad.top], paddingBottomRight: [pad.right, pad.bottom], maxZoom: 17 });
    },
    setCar(p, heading) {
      if (!map.hasLayer(carM)) carM.addTo(map);
      carM.setLatLng([p.lat, p.lng]);
      const el = carM.getElement();
      if (el) el.firstChild.style.transform = `rotate(${heading}deg)`;
    },
    setAcc(p, r) { if (!map.hasLayer(acc)) acc.addTo(map); acc.setLatLng([p.lat, p.lng]).setRadius(r); },
    setRoute(points) { const ll = points.map(p => [p.lat, p.lng]); casing.setLatLngs(ll).addTo(map); line.setLatLngs(ll).addTo(map); },
    clearRoute() { casing.remove(); line.remove(); },
    setChargers(list, onTap) {
      chargerLayer.clearLayers();
      list.forEach(c => L.circleMarker([c.lat, c.lng], { radius: 7, color: '#fff', weight: 2, fillColor: '#2fbf71', fillOpacity: 1 })
        .on('click', () => onTap(c)).addTo(chargerLayer));
    },
    setDest(p) { destM.setLatLng([p.lat, p.lng]).addTo(map); },
    clearDest() { destM.remove(); },
    popup(p, el) { popup = L.popup({ closeButton: false }).setLatLng([p.lat, p.lng]).setContent(el).openOn(map); },
    closePopup() { if (popup) map.closePopup(popup); popup = null; },
    on(ev, fn) {
      if (ev === 'longpress') map.on('contextmenu', e => fn({ lat: e.latlng.lat, lng: e.latlng.lng }));
      else if (ev === 'userMove') map.on('dragstart', fn);
      else map.on(ev, fn);
    },
  };
}

const M = engine === 'vector' ? vectorMap() : classicMap();
M.on('moveend', () => { const c = M.center(); store.set('view', { lat: c.lat, lng: c.lng, z: M.zoom() }); });

// ---------------------------------------------------------------- state
let pos = null;              // latest fix {lat,lng,speed,course,acc,ts,src}
let shown = null;            // position currently drawn (animated towards pos)
let follow = true;
let route = null;            // see buildRoute()
let dest = null;             // {lat,lng,name}
let source = 'none';         // 'phone' | 'browser' | 'none'
let mode = 'map';            // 'map' | 'mirror'
let sim = null;
let voiceOn = store.get('voice', true);
let arrived = false;

// ---------------------------------------------------------------- position
let heading = 0, shownHeading = 0, anim = null;
// Heading-up: the map turns so the road ahead is always up (vector map only).
let headingUp = store.get('headingUp', true);

function onFix(p) {
  if (sim && p.src !== 'sim') return;
  if (!(p.course >= 0)) p.course = pos && dist(pos, p) > 4 ? bearing(pos, p) : (pos ? pos.course : 0);
  const first = !pos;
  pos = p;
  M.setAcc(p, Math.min(p.acc || 0, 200));
  rotateCar(p.course);
  if (first) { shown = p; shownHeading = heading; M.jump(p, { zoom: 16 }); }
  animateTo(p);

  const kmh = p.speed > 0 ? Math.round(p.speed * 3.6) : 0;
  show($('speed'), true);
  $('speed').querySelector('b').textContent = kmh;

  if (route) navUpdate();
  else if (dest && first) routeTo(dest, { resume: true });
}

function rotateCar(course) {
  // Take the short way round: 350° → 10° turns 20°, not 340°.
  heading += ((course - heading + 540) % 360) - 180;
}

/** Glide the car (and heading) to the new fix over ~1 s so the map moves smoothly. */
function animateTo(p) {
  const from = shown || p, fromHeading = shownHeading, t0 = performance.now(), dur = 900;
  cancelAnimationFrame(anim);
  const step = now => {
    const k = Math.min(1, (now - t0) / dur);
    shown = { lat: from.lat + (p.lat - from.lat) * k, lng: from.lng + (p.lng - from.lng) * k };
    shownHeading = fromHeading + (heading - fromHeading) * k;
    M.setCar(shown, shownHeading);
    if (follow) followCar();
    if (k < 1) anim = requestAnimationFrame(step);
  };
  anim = requestAnimationFrame(step);
}

/**
 * Keep the car in view. Heading-up (vector map): the map turns with the car, tilts, and the
 * car sits low on screen so the road ahead fills it. North-up: the view is pushed ahead of the
 * car in the direction it's driving.
 */
function followCar() {
  if (!shown) return;
  if (M.canRotate && headingUp && route) return M.jump(shown, { bearing: shownHeading, pitch: 45, ahead: 0.22 });
  if (M.canRotate && headingUp && pos && pos.speed > 2) return M.jump(shown, { bearing: shownHeading, pitch: 0, ahead: 0.12 });
  if (!route) return M.jump(shown);
  M.jumpAhead(shown, shownHeading, 0.22);
}

function renderNorth() {
  show($('northBtn'), M.canRotate);
  $('northBtn').innerHTML = `<svg viewBox="0 0 24 24" style="transform:rotate(${headingUp ? 0 : 0}deg)" fill="currentColor"><path d="M12 2l7 19-7-4-7 4z"/></svg>${headingUp ? 'HEAD' : 'N'}`;
}
$('northBtn').onclick = () => {
  headingUp = !headingUp; store.set('headingUp', headingUp); renderNorth();
  if (!headingUp && M.canRotate && shown) M.jump(shown, { bearing: 0, pitch: 0 });
  setFollow(true);
};
renderNorth();

function setFollow(on) {
  follow = on;
  show($('recenter'), !on && !!pos);
  if (on && pos) {
    if (route && M.zoom() < 16) M.setZoom(17);
    followCar();
  }
}
M.on('userMove', () => setFollow(false));
$('recenter').onclick = () => setFollow(true);

// ---------------------------------------------------------------- location sources
function useBrowserLocation() {
  if (!('geolocation' in navigator)) { source = 'none'; setStatus('No location source — open this page from the TeslaNav iPhone app', 'bad'); return; }
  source = 'browser';
  navigator.geolocation.watchPosition(g => {
    const c = g.coords;
    onFix({ lat: c.latitude, lng: c.longitude, speed: c.speed ?? -1, course: c.heading ?? -1, acc: c.accuracy, ts: g.timestamp, src: 'browser' });
  }, e => setStatus('Browser location unavailable: ' + e.message, 'bad'),
  { enableHighAccuracy: true, maximumAge: 1000, timeout: 20000 });
}

/** The Tesla browser shares the car's own GPS with web pages. */
function detectSource() {
  useBrowserLocation();
}

// ---------------------------------------------------------------- search
let searchSeq = 0, searchTimer;
const q = $('q'), results = $('results');

function renderResults(items, note) {
  results.innerHTML = note ? `<div class="res note">${esc(note)}</div>` : '';
  for (const it of items) {
    const div = document.createElement('div');
    div.className = 'res';
    const away = pos ? ' · ' + fmtDist(dist(pos, it)) : '';
    div.innerHTML = `<b>${esc(it.name)}</b><span>${esc((it.detail || '') + away)}</span>`;
    div.onclick = () => choose(it);
    results.appendChild(div);
  }
}

function showRecents() {
  const recents = store.get('recent', []);
  renderResults(recents, recents.length ? '' : '');
  if (recents.length) results.insertAdjacentHTML('afterbegin', '<div class="res note">Recent</div>');
}

async function search() {
  const text = q.value.trim();
  show($('clearQ'), !!text);
  if (text.length < 3) return showRecents();
  const m = text.match(/^\s*(-?\d{1,2}(?:\.\d+)?)\s*[,\s]\s*(-?\d{1,3}(?:\.\d+)?)\s*$/);
  if (m) return renderResults([{ name: 'Coordinates', detail: `${m[1]}, ${m[2]}`, lat: +m[1], lng: +m[2] }]);

  const c = pos || M.center();
  const seq = ++searchSeq;
  // The offline index answers instantly; Photon's online results are added below it.
  let local = [];
  try { local = await searchLocal(text, c); } catch {}
  if (seq !== searchSeq) return;
  if (local.length) renderResults(local);
  try {
    const online = await searchPhoton(text, c);
    if (seq !== searchSeq) return;
    const merged = local.concat(online.filter(o => !local.some(l => dist(l, o) < 60))).slice(0, 10);
    renderResults(merged, merged.length ? '' : 'Nothing found');
  } catch {
    if (local.length) return;
    try {
      const items = await searchNominatim(text, c);
      if (seq === searchSeq) renderResults(items, items.length ? '' : 'Nothing found');
    } catch {
      if (seq === searchSeq) renderResults([], 'Search failed — no internet?');
    }
  }
}

// ---------------------------------------------------------------- offline search (Armenia)
// data/am-search.json is built from OpenStreetMap by tools/build_search_index.py. Every name
// and every query goes through fold(), which transliterates Armenian and Cyrillic to Latin and
// merges spelling variants, so "kaskad", "Каскад", "Կասկադ" and "cascade" all meet.
const ARMENIA = { s: 38.7, n: 41.4, w: 43.3, e: 46.8 };
const inArmenia = p => p.lat > ARMENIA.s && p.lat < ARMENIA.n && p.lng > ARMENIA.w && p.lng < ARMENIA.e;
const HY = { 'ա':'a','բ':'b','գ':'g','դ':'d','ե':'e','զ':'z','է':'e','ը':'e','թ':'t','ժ':'zh','ի':'i','լ':'l','խ':'kh','ծ':'ts',
  'կ':'k','հ':'h','ձ':'dz','ղ':'gh','ճ':'ch','մ':'m','յ':'y','ն':'n','շ':'sh','ո':'o','չ':'ch','պ':'p','ջ':'j','ռ':'r','ս':'s',
  'վ':'v','տ':'t','ր':'r','ց':'ts','ւ':'v','փ':'p','ք':'k','և':'ev','օ':'o','ֆ':'f' };
const RU = { 'а':'a','б':'b','в':'v','г':'g','д':'d','е':'e','ё':'e','ж':'zh','з':'z','и':'i','й':'i','к':'k','л':'l','м':'m',
  'н':'n','о':'o','п':'p','р':'r','с':'s','т':'t','у':'u','ф':'f','х':'kh','ц':'ts','ч':'ch','ш':'sh','щ':'sh','ъ':'','ы':'y',
  'ь':'','э':'e','ю':'yu','я':'ya' };

/** Folds a name or query to a spelling-insensitive Latin "sound key". */
function fold(text) {
  // Drop accents and invisible marks (OSM names sometimes carry a left-to-right mark mid-word).
  let t = text.toLowerCase().normalize('NFKD').replace(/[\u0300-\u036f\u200b-\u200f\u00ad\u2060]/g, '').replace(/ու/g, 'u');
  t = t.replace(/[\u0561-\u0587]/g, ch => HY[ch] ?? ch).replace(/[\u0430-\u044f\u0451]/g, ch => RU[ch] ?? ch);
  t = t.replace(/x/g, 'kh').replace(/tch/g, 'ch').replace(/ch/g, 'C').replace(/sh/g, 'S').replace(/zh/g, 'Z')
       .replace(/kh/g, 'H').replace(/gh/g, 'H').replace(/ts|tz/g, 'T').replace(/dz/g, 'D').replace(/ph/g, 'p')
       .replace(/th/g, 't').replace(/ck/g, 'k').replace(/c/g, 'k').replace(/q/g, 'k').replace(/w/g, 'v')
       .replace(/y/g, 'i').replace(/h/g, 'H').replace(/ou/g, 'u');
  return t.split(/[^a-zA-Z0-9]+/).filter(Boolean)
          // Yerevan/Erevan; doubled letters; English silent final e (Cascade → kaskad).
          .map(w => w.replace(/^ie/, 'e').replace(/(.)\1+/g, '$1').replace(/^(.{4,}[^aeiou])e$/, '$1'));
}
// Words that say what kind of thing it is, not which one ("street", "улица", "փողոց"...).
const STOP = new Set(['street', 'st', 'str', 'avenue', 'ave', 'road', 'rd', 'lane', 'square', 'district', 'ulitsa', 'ul',
  'prospekt', 'pr', 'ploshad', 'poghots', 'poghota', 'poxoc', 'poghoc', 'taghamas', 'nrbanTsk', 'hraparak', 'mairughi',
  'улица', 'проспект', 'փողոց', 'պողոտա', 'թաղամաս', 'նրբանցք', 'հրապարակ', 'մայրուղի'].flatMap(fold));
const words = text => fold(text).filter(w => !STOP.has(w));

const CHARGER_WORDS = ['charger', 'charging', 'charge', 'chargers', 'ev', 'зарядка', 'зарядная', 'зарядные', 'заряд',
  'լիցքավորում', 'լիցքավորման', 'lickavorum'].flatMap(fold);
const isLatin = t => /^[\x00-\x7F«»“”‘’–—]+$/.test(t);
let searchIndex = null, addressIndex = null;

/** Loads the index once, the first time it's useful (the car is in or near Armenia). */
function loadSearchIndex() {
  if (searchIndex) return searchIndex;
  searchIndex = fetch('data/am-search.json').then(r => r.json()).then(d => {
    const towns = d.towns.map(([name, alts]) => alts.find(isLatin) || name);
    const entries = d.e.map(([kind, name, alts, lat, lng, town, extra]) => {
      const all = [name, ...alts];
      return { kind, name, alts, lat: lat / 1e5, lng: lng / 1e5, town: town >= 0 ? towns[town] : '', extra,
               display: isLatin(name) ? name : (alts.find(isLatin) || name), keys: all.map(words) };
    });
    return { entries };
  });
  return searchIndex;
}
function loadAddresses() {
  if (addressIndex) return addressIndex;
  addressIndex = fetch('data/am-addresses.json').then(r => r.json()).then(d =>
    Object.entries(d.streets).map(([street, list]) => ({ street, keys: words(street), list })));
  return addressIndex;
}
q.addEventListener('focus', () => { const c = pos || M.center(); if (inArmenia(c)) loadSearchIndex(); });

/** How well query words `qw` match a name's words `kw` (0 = no match). */
function matchScore(qw, kw) {
  if (!qw.length || !kw.length) return 0;
  let score = 0;
  for (const w of qw) {
    let best = 0;
    for (let i = 0; i < kw.length; i++) {
      const k = kw[i];
      const s = k === w ? 10 : k.startsWith(w) ? 7 : (w.length >= 4 && k.includes(w)) ? 3 : 0;
      if (s > best) best = s + (i === 0 ? 1 : 0);
    }
    if (!best) return 0;
    score += best;
  }
  if (qw.length === kw.length && qw.every((w, i) => w === kw[i])) score += 8;   // the whole name
  return score;
}

const KIND_WEIGHT = [30, 22, 22, 10, 14];            // town, village, district, place, street
const KIND_LABEL = ['Town', 'Village', 'District', '', 'Street'];
// Places people drive to by name get a head start over the shop that borrowed it.
const LANDMARK = new Set(['attraction', 'museum', 'mall', 'marketplace', 'stadium', 'theatre', 'university', 'hospital',
  'station', 'aerodrome', 'monument', 'memorial', 'park', 'zoo', 'viewpoint', 'monastery', 'church', 'fort', 'castle']);

/** English name of the street an address is on (from the street entries) and its town. */
function describeAddress(entries, streetName, p) {
  let street = streetName, streetTown = '', best = Infinity, nearestTown = '', bestTown = Infinity;
  for (const e of entries) {
    const d = dist(p, e);
    if (e.kind === 4 && e.name === streetName && d < best) { best = d; street = e.display; streetTown = e.town; }
    else if (e.kind <= 1 && d < bestTown) { bestTown = d; nearestTown = e.display; }
  }
  return { street, town: best < 5000 ? streetTown : nearestTown };
}

async function searchLocal(text, c) {
  if (!inArmenia(c)) return [];
  const { entries } = await loadSearchIndex();
  const house = text.match(/(?:^|\s)(\d+[a-zա-ֆа-я]?(?:\/\d+)?)(?=\s|$)/i);
  const qw = words(text.replace(house ? house[1] : '', ' '));
  const found = [];
  if (house && qw.length) {
    // "Abovyan 10": the street, then the house on it nearest to where we are.
    for (const s of await loadAddresses()) {
      const m = matchScore(qw, s.keys);
      if (!m) continue;
      for (const [hn, lat, lng] of s.list) {
        if (hn.toLowerCase() !== house[1].toLowerCase()) continue;
        const p = { lat: lat / 1e5, lng: lng / 1e5 };
        const { street, town } = describeAddress(entries, s.street, p);
        found.push({ score: 40 + m - 12 * Math.log10(1 + dist(c, p) / 1000), name: `${street} ${hn}`, detail: ['Address', town].filter(Boolean).join(' · '), ...p });
      }
    }
  }
  if (qw.length) {
    for (const e of entries) {
      let m = 0;
      for (const k of e.keys) m = Math.max(m, matchScore(qw, k));
      if (!m) continue;
      const km = dist(c, e) / 1000;
      const score = m + KIND_WEIGHT[e.kind] - 12 * Math.log10(1 + km) + (e.kind <= 2 && e.extra ? Math.log10(1 + e.extra) : 0)
                  + (e.kind === 3 && LANDMARK.has(e.extra) ? (e.extra === 'attraction' || e.extra === 'museum' ? 8 : 6) : 0);
      const label = e.kind === 3 ? (e.extra === 'yes' ? '' : (e.extra || '').replace(/_/g, ' ')) : KIND_LABEL[e.kind];
      const detail = [e.display !== e.name ? e.name : '', label, e.town].filter(Boolean).join(' · ');
      found.push({ score, name: e.display, detail, lat: e.lat, lng: e.lng });
    }
  }
  // EV chargers: by name or operator, or all nearby for "charger", "зарядка", "լիցքավորում"…
  const wantsChargers = CHARGER_WORDS.some(k => qw.some(w => w.length >= 3 && k.startsWith(w)));
  if (qw.length) {
    for (const ch of await loadChargers()) {
      const m = wantsChargers ? 12 : Math.max(matchScore(qw, words(ch.n)), ch.o ? matchScore(qw, words(ch.o)) : 0);
      if (!m) continue;
      const detail = ['EV charger', ch.o, ch.s.join(', ') || 'connectors not listed'].filter(Boolean).join(' · ');
      found.push({ score: m + 14 - 12 * Math.log10(1 + dist(c, ch) / 1000), name: '⚡ ' + ch.n, detail, lat: ch.lat, lng: ch.lng });
    }
  }
  found.sort((a, b) => b.score - a.score);
  // One result per place: a street's segments or a shop's duplicates within 150 m collapse.
  const out = [];
  for (const f of found) {
    if (out.some(o => o.name === f.name && dist(o, f) < 150)) continue;
    out.push(f);
    if (out.length === 8) break;
  }
  return out;
}

/**
 * Photon (OSM data, made for typing as you search). Its "near me" bias alone still lets an
 * exact name match in another country outrank the place down the road, so search within
 * ~100 km first and only fill up from everywhere when that finds too little.
 */
async function searchPhoton(text, c) {
  const base = `https://photon.komoot.io/api/?q=${encodeURIComponent(text)}&lat=${c.lat.toFixed(4)}&lon=${c.lng.toFixed(4)}&limit=8`;
  const bbox = [c.lng - 1.2, c.lat - 0.9, c.lng + 1.2, c.lat + 0.9].map(v => v.toFixed(4)).join(',');
  const near = (await (await fetchT(`${base}&bbox=${bbox}`, 7000)).json()).features.map(toPhotonItem);
  if (near.length >= 3) return near;
  const wide = (await (await fetchT(base, 7000)).json()).features.map(toPhotonItem);
  return near.concat(wide.filter(w => !near.some(n => dist(n, w) < 30))).slice(0, 8);
}

function toPhotonItem(f) {
    const p = f.properties, [lng, lat] = f.geometry.coordinates;
    const street = [p.street, p.housenumber].filter(Boolean).join(' ');
    const name = p.name || street || p.city || 'Place';
    const detail = [p.name ? street : '', p.district, p.city, p.country].filter(Boolean).join(', ');
    return { name, detail, lat, lng };
}

/** Backup: Nominatim, nearby matches first (~60 km box), then from everywhere. */
async function searchNominatim(text, c) {
  const vb = [c.lng - 0.7, c.lat + 0.5, c.lng + 0.7, c.lat - 0.5].map(v => v.toFixed(4)).join(',');
  const base = `https://nominatim.openstreetmap.org/search?format=jsonv2&limit=7&q=${encodeURIComponent(text)}`;
  const toItem = x => {
    const parts = x.display_name.split(', ');
    return { name: x.name || parts[0], detail: parts.slice(1).join(', '), lat: +x.lat, lng: +x.lon, id: x.place_id };
  };
  let items = (await (await fetchT(`${base}&viewbox=${vb}&bounded=1`, 8000)).json()).map(toItem);
  items.sort((a, b) => dist(c, a) - dist(c, b));
  if (items.length < 3) {
    const wide = (await (await fetchT(`${base}&viewbox=${vb}`, 8000)).json()).map(toItem);
    items = items.concat(wide.filter(w => !items.some(i => i.id === w.id))).slice(0, 7);
  }
  return items;
}

// ---------------------------------------------------------------- routing
let routing = false;

async function routeTo(d, { reroute = false, resume = false } = {}) {
  if (routing) return;
  const from = pos || M.center();
  let url = `https://router.project-osrm.org/route/v1/driving/${from.lng.toFixed(6)},${from.lat.toFixed(6)};` +
            `${d.lng.toFixed(6)},${d.lat.toFixed(6)}?overview=false&steps=true&geometries=geojson`;
  // Moving: start the route in the direction we're already going, not with a U-turn.
  if (pos && pos.speed > 3 && pos.course >= 0) url += `&bearings=${Math.round(pos.course)},60;`;
  routing = true;
  if (!reroute) toast('Finding route…', 10000);
  try {
    const j = await (await fetchT(url, 12000)).json();
    if (j.code !== 'Ok' || !j.routes || !j.routes.length) throw new Error(j.message || 'no route');
    const fresh = !route || !reroute;
    setRoute(buildRoute(j.routes[0]), d);
    if (fresh) {
      toast(`${fmtDuration(route.duration)} · ${fmtDist(route.total)}`);
      if (!resume) say(`Starting route to ${d.name || 'your destination'}. ${fmtDuration(route.duration).replace('min', 'minutes').replace('h', 'hours')}.`);
      overview(true);
      if (params.has('sim') && !sim) setTimeout(() => { if (!sim) toggleSim(); }, 5500);
    }
  } catch (e) {
    toast('Could not get a route' + (e.name === 'AbortError' ? ' — no internet?' : ': ' + e.message));
  } finally {
    routing = false;
    if (route) route.lastReroute = Date.now();
  }
}

/**
 * The route is rebuilt from the step geometries rather than the overview, so every step
 * knows exactly where on the polyline its maneuver is.
 */
function buildRoute(rt) {
  const pts = [], steps = [];
  for (const leg of rt.legs) for (const st of leg.steps) {
    const startIdx = pts.length ? pts.length - 1 : 0;
    st.geometry.coordinates.forEach((c, i) => { if (!(pts.length && i === 0)) pts.push({ lat: c[1], lng: c[0] }); });
    const m = st.maneuver;
    steps.push({ startIdx, dur: st.duration, type: m.type, mod: m.modifier || '', exit: m.exit,
                 bearingAfter: m.bearing_after, name: st.name || '', ref: st.ref || '' });
  }
  const cum = [0];
  for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + dist(pts[i - 1], pts[i]));
  const total = cum[cum.length - 1];
  steps.forEach((s, i) => { s.start = cum[s.startIdx]; s.text = instruction(s); });
  steps.forEach((s, i) => { s.end = i + 1 < steps.length ? steps[i + 1].start : total; });
  const after = new Array(steps.length).fill(0);   // seconds of driving after step i
  for (let i = steps.length - 2; i >= 0; i--) after[i] = after[i + 1] + steps[i + 1].dur;
  return { pts, cum, total, steps, after, duration: rt.duration, hint: 0, off: 0, lastReroute: Date.now(), ann: {} };
}

function setRoute(r, d) {
  route = r; dest = d; arrived = false;
  store.set('dest', d);
  M.setRoute(r.pts);
  M.setDest(d);
  document.body.classList.add('navigating');
  show($('search'), false); show($('banner'), true); show($('trip'), true);
  if (sim) sim.along = 0;
  if (pos) navUpdate();
  else {
    // No GPS fix yet: show the first turn and the whole trip until one arrives.
    let j = 1;
    while (j < r.steps.length - 1 && !important(r.steps[j])) j++;
    const first = r.steps[Math.min(j, r.steps.length - 1)];
    renderBanner(first, first.start, null);
    renderTrip(r.total, r.duration);
  }
}

function endRoute() {
  route = null; dest = null; store.set('dest', null);
  M.clearRoute(); M.clearDest();
  document.body.classList.remove('navigating');
  show($('search'), true); show($('banner'), false); show($('trip'), false);
  if (sim) toggleSim();
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  setFollow(true);
}
$('end').onclick = endRoute;

let overviewTimer;
function overview(auto) {
  if (!route) return;
  setFollow(false);
  M.fit(pos ? [...route.pts, pos] : route.pts, { top: 60, bottom: 60, left: 520, right: 120 });
  clearTimeout(overviewTimer);

// ---------------------------------------------------------------- guidance
function locate(r, p) {
  const n = r.pts.length;
  if (n < 2) return { i: 0, t: 0, d: dist(p, r.pts[0]), along: 0 };
  const scan = (a, b) => {
    let best = { i: a, t: 0, d: Infinity };
    for (let i = a; i <= b; i++) {
      const s = projSeg(p, r.pts[i], r.pts[i + 1]);
      if (s.d < best.d) best = { i, t: s.t, d: s.d };
    }
    return best;
  };
  // Search near where we were last time; only fall back to the whole route when that fails,
  // so a route that passes the same road twice doesn't make us jump ahead.
  let best = scan(Math.max(0, r.hint - 3), Math.min(n - 2, r.hint + 150));
  if (best.d > 60) { const all = scan(0, n - 2); if (all.d < best.d - 20) best = all; }
  r.hint = best.i;
  best.along = r.cum[best.i] + best.t * (r.cum[best.i + 1] - r.cum[best.i]);
  return best;
}

function pointAt(r, along) {
  let lo = 0, hi = r.cum.length - 1;
  while (lo < hi - 1) { const mid = (lo + hi) >> 1; if (r.cum[mid] <= along) lo = mid; else hi = mid; }
  const seg = r.cum[hi] - r.cum[lo], t = seg ? Math.min(1, Math.max(0, (along - r.cum[lo]) / seg)) : 0;
  const a = r.pts[lo], b = r.pts[hi];
  return { lat: a.lat + (b.lat - a.lat) * t, lng: a.lng + (b.lng - a.lng) * t, idx: lo };
}

/** Maneuvers worth a banner and a voice prompt; "continue straight" and name changes aren't. */
function important(s) {
  if (s.type === 'new name') return false;
  if ((s.type === 'continue' || s.type === 'notification') && (s.mod === 'straight' || !s.mod)) return false;
  return true;
}

function navUpdate() {
  const r = route;
  if (!r || !pos || arrived) return;
  const loc = locate(r, pos);

  // Off route for three fixes in a row → ask for a new route (at most every 8 s).
  const tolerance = Math.max(35, Math.min(80, (pos.acc || 10) * 1.5));
  r.off = loc.d > tolerance ? r.off + 1 : 0;
  if (r.off >= 3 && !routing && Date.now() - r.lastReroute > 8000) {
    r.off = 0;
    toast('Rerouting…'); say('Rerouting');
    routeTo(dest, { reroute: true });
  }

  // Current step = last one whose maneuver we've passed; next = first important one after it.
  let k = 0;
  while (k + 1 < r.steps.length && r.steps[k + 1].start <= loc.along) k++;
  let j = k + 1;
  while (j < r.steps.length - 1 && !important(r.steps[j])) j++;
  j = Math.min(j, r.steps.length - 1);
  const next = r.steps[j], dNext = Math.max(0, next.start - loc.along);

  let j2 = j + 1;
  while (j2 < r.steps.length - 1 && !important(r.steps[j2])) j2++;
  const then = j2 < r.steps.length && r.steps[j2].start - next.start < 250 ? r.steps[j2] : null;

  renderBanner(next, dNext, then);
  announce(j, next, dNext, then);

  const remain = Math.max(0, r.total - loc.along);
  const cur = r.steps[k], span = Math.max(1, cur.end - cur.start);
  const secs = Math.max(0, (cur.end - loc.along) / span) * cur.dur + r.after[k];
  renderTrip(remain, secs);

  // Draw only the road still ahead.
  M.setRoute([pos, ...r.pts.slice(loc.i + 1)]);

  if (remain < 25 || (next.type === 'arrive' && dNext < 20 && loc.d < 50)) arrive();
}

function arrive() {
  arrived = true;
  say('You have arrived' + (dest && dest.name && dest.name !== 'Dropped pin' ? ' at ' + dest.name : ''));
  toast('You have arrived', 5000);
  setTimeout(endRoute, 5000);
}

function renderBanner(s, d, then) {
  $('bIcon').innerHTML = maneuverIcon(s);
  $('bDist').textContent = s.type === 'arrive' && d < 30 ? 'Now' : fmtDist(d);
  $('bText').textContent = s.text;
  show($('bThen'), !!then);
  if (then) $('bThen').innerHTML = 'Then ' + maneuverIcon(then);
}

function renderTrip(remain, secs) {
  const at = new Date(Date.now() + secs * 1000);
  $('tArrive').textContent = at.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
  $('tRest').textContent = `${fmtDuration(secs)} · ${fmtDist(remain)}`;
}

// ---------------------------------------------------------------- instructions
/** Armenian → readable Latin for street names in instructions and speech ("Վազգեն Սարգսյանի փողոց" → "Vazgen Sargsyani Poghots"). */
const HY_READ = { 'ա':'a','բ':'b','գ':'g','դ':'d','ե':'e','զ':'z','է':'e','ը':'y','թ':'t','ժ':'zh','ի':'i','լ':'l','խ':'kh','ծ':'ts',
  'կ':'k','հ':'h','ձ':'dz','ղ':'gh','ճ':'ch','մ':'m','յ':'y','ն':'n','շ':'sh','ո':'o','չ':'ch','պ':'p','ջ':'j','ռ':'r','ս':'s',
  'վ':'v','տ':'t','ր':'r','ց':'ts','ւ':'v','փ':'p','ք':'k','և':'ev','օ':'o','ֆ':'f' };
const HY_TYPES = { 'փողոց': 'Street', 'պողոտա': 'Avenue', 'խճուղի': 'Highway', 'մայրուղի': 'Highway', 'նրբանցք': 'Lane',
  'հրապարակ': 'Square', 'թաղամաս': 'District', 'փակուղի': 'Dead End', 'կամուրջ': 'Bridge', 'զբոսայգի': 'Park' };
function readable(name) {
  if (!name || !/[\u0531-\u0587]/.test(name)) return name;
  // "Սարգսյանի փողոց" is "Sargsyan's street": drop the possessive -ի and translate the street word.
  const parts = name.replace(/[\u200b-\u200f]/g, '').trim().split(/\s+/);
  const type = HY_TYPES[parts[parts.length - 1].toLowerCase()];
  if (type) {
    parts.pop();
    // Not for "Երևան-Գյումրի մայրուղի": a road between two towns, and Gyumri really ends in -ի.
    if (parts.length && !parts[parts.length - 1].includes('-')) parts[parts.length - 1] = parts[parts.length - 1].replace(/ի$/, '');
  }
  return parts.join(' ').split(/(\s+|-)/).map(w => {
    const lower = w.toLowerCase().replace(/ու/g, '\u0000').replace(/^ե/, 'ye').replace(/^ո(?!\u0000)/, 'vo');
    const latin = lower.replace(/[\u0561-\u0587]/g, ch => HY_READ[ch] ?? ch).replace(/\u0000/g, 'u');
    return latin.charAt(0).toUpperCase() + latin.slice(1);
  }).join('') + (type ? ' ' + type : '');
}

const ordinal = n => n + (['th', 'st', 'nd', 'rd'][(n % 100 - 20) % 10] || ['th', 'st', 'nd', 'rd'][n % 100] || 'th');
function side(mod) { return mod.includes('left') ? 'left' : mod.includes('right') ? 'right' : 'straight'; }
function turnWord(mod) {
  return { 'sharp left': 'Turn sharp left', left: 'Turn left', 'slight left': 'Bear left',
           'sharp right': 'Turn sharp right', right: 'Turn right', 'slight right': 'Bear right',
           straight: 'Go straight', uturn: 'Make a U-turn' }[mod] || 'Continue';
}
function compass(b) { return ['north', 'northeast', 'east', 'southeast', 'south', 'southwest', 'west', 'northwest'][Math.round(b / 45) % 8]; }

function instruction(s) {
  const road = readable(s.name) || s.ref;
  const onto = road ? ` onto ${road}` : '';
  switch (s.type) {
    case 'depart': return `Head ${compass(s.bearingAfter || 0)}` + (road ? ` on ${road}` : '');
    case 'arrive': return 'Arrive at your destination' + (s.mod === 'left' || s.mod === 'right' ? `, on the ${s.mod}` : '');
    case 'roundabout': case 'rotary':
      return s.exit ? `At the roundabout, take the ${ordinal(s.exit)} exit${onto}` : `Enter the roundabout${onto}`;
    case 'roundabout turn': return `At the roundabout, ${turnWord(s.mod).toLowerCase()}${onto}`;
    case 'exit roundabout': case 'exit rotary': return `Exit the roundabout${onto}`;
    case 'merge': return `Merge ${side(s.mod) === 'straight' ? '' : side(s.mod) + ' '}${onto.trim()}`.trim();
    case 'on ramp': return `Take the ramp${side(s.mod) === 'straight' ? '' : ' on the ' + side(s.mod)}${onto}`;
    case 'off ramp': return `Take the exit${side(s.mod) === 'straight' ? '' : ' on the ' + side(s.mod)}${onto}`;
    case 'fork': return `Keep ${side(s.mod)} at the fork${onto}`;
    case 'end of road': return `At the end of the road, turn ${side(s.mod)}${onto}`;
    case 'new name': case 'continue':
      if (s.mod === 'uturn') return 'Make a U-turn' + onto;
      if (!s.mod || s.mod === 'straight') return `Continue${onto}`;
      return `Keep ${side(s.mod)}${onto}`;
    default: return turnWord(s.mod) + onto;
  }
}

function maneuverIcon(s) {
  const stroke = 'fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"';
  if (s.type === 'arrive') {
    return `<svg viewBox="0 0 48 48" ${stroke}><path d="M14 44V5"/><path d="M14 7h22l-5 7 5 7H14" fill="currentColor"/></svg>`;
  }
  if (s.mod === 'uturn') {
    return `<svg viewBox="0 0 48 48" ${stroke}><path d="M32 44V20a9 9 0 0 0-18 0v10"/><path d="M7 24l7 8 7-8"/></svg>`;
  }
  const angle = { 'sharp left': -135, left: -90, 'slight left': -45, straight: 0, 'slight right': 45, right: 90, 'sharp right': 135 }[s.mod] ?? 0;
  if (/roundabout|rotary/.test(s.type)) {
    // Ring with the exit number inside, entry from below, exit arrow leaving the ring.
    const num = s.exit ? `<text x="24" y="29" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor" stroke="none" font-family="system-ui,sans-serif">${s.exit}</text>` : '';
    return `<svg viewBox="0 0 48 48" ${stroke}><circle cx="24" cy="24" r="11"/>${num}<path d="M24 46V35"/>` +
           `<g transform="rotate(${angle} 24 24)"><path d="M24 13V4"/><path d="M17 10l7-7 7 7"/></g></svg>`;
  }
  return `<svg viewBox="0 0 48 48" ${stroke}><path d="M24 45V24"/>` +
         `<g transform="rotate(${angle} 24 24)"><path d="M24 24V5"/><path d="M15 13l9-9 9 9"/></g></svg>`;
}

// ---------------------------------------------------------------- voice
function say(text) {
  if (!voiceOn || mode === 'mirror' || !('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US'; u.rate = 1.0;
  speechSynthesis.speak(u);
}
// Browsers only allow speech after a user gesture.
document.addEventListener('pointerdown', () => { if ('speechSynthesis' in window) speechSynthesis.speak(new SpeechSynthesisUtterance('')); }, { once: true });

/** Up to three prompts per maneuver: early, near, and now; distances scale with speed. */
function announce(j, s, d, then) {
  const v = Math.max(pos.speed || 0, 8);
  const nowD = Math.max(25, v * 3), nearD = Math.max(150, v * 11), farD = v > 22 ? 1500 : v > 14 ? 1000 : 600;
  const a = route.ann[j] || (route.ann[j] = { first: d });
  const lower = t => t.charAt(0).toLowerCase() + t.slice(1);
  const thenText = then ? `, then ${lower(then.text)}` : '';
  if (!a.now && d <= nowD) {
    a.now = a.near = a.far = true;
    if (s.type !== 'arrive') say(s.text + thenText);
  } else if (!a.near && d <= nearD) {
    a.near = a.far = true;
    say(`In ${spokenDist(d)}, ${lower(s.text)}`);
  } else if (!a.far && d <= farD && a.first > nearD + 300) {
    a.far = true;
    say(`In ${spokenDist(d)}, ${lower(s.text)}`);
  }
}

// EV charging stations (data/am-chargers.json: OpenStreetMap, plus Open Charge Map when the
// index is built with a key). The ⚡ panel lists them nearest first with connector and

let chargersOn = store.get('chargers', false), chargerList = null;
let chargerFilter = store.get('chargerFilter', { conn: '', op: '', unknown: false });
let bigOperators = new Set();   // operators with 2+ stations get their own chip; the rest are "Other"
const CONNECTORS = ['CCS2', 'Type 2', 'CHAdeMO', 'GB/T', 'GB/T DC', 'Tesla'];
const SOCKET = { type2: 'Type 2', type2_combo: 'CCS2', chademo: 'CHAdeMO', gb_t: 'GB/T', gb_t_dc: 'GB/T DC', gb_ac: 'GB/T',
                 type1: 'Type 1', type1_combo: 'CCS1', tesla_supercharger: 'Tesla', schuko: 'Socket' };

async function loadChargers() {
  if (!chargerList) {
    const d = await (await fetch('data/am-chargers.json')).json();
    // A station named only in Armenian ("Թիմ էներջի") shows its operator's name ("Team Energy") instead.
    chargerList = d.chargers.map(c => ({ ...c, n: isLatin(c.n) ? c.n : (c.o && isLatin(c.o) ? c.o : readable(c.n)),
      s: c.s.map(k => SOCKET[k] || k), lat: c.ll[0] / 1e5, lng: c.ll[1] / 1e5 }));
    const counts = {};
    chargerList.forEach(c => { if (c.o) counts[c.o] = (counts[c.o] || 0) + 1; });
    bigOperators = new Set(Object.keys(counts).filter(o => counts[o] >= 2));
  }
  return chargerList;
}

const opOf = c => bigOperators.has(c.o) ? c.o : 'Other';
function passes(c, f = chargerFilter) {
  if (f.op && opOf(c) !== f.op) return false;
  if (!f.conn) return true;
  if (!c.s.length) return f.unknown;          // no connector data: shown only when asked
  return c.s.includes(f.conn) || (f.conn === 'GB/T' && c.s.includes('GB/T DC'));
}

function connBadges(c) {
  return c.s.length ? c.s.map(k => `<span class="conn">${esc(k)}</span>`).join('')
                    : '<span class="conn unknown">Connectors not listed</span>';
}

function showCharger(c) {
  const el = document.createElement('div');
  el.style.cssText = 'min-width:240px;font-size:16px';
  el.innerHTML = `<b>${esc(c.n)}</b><div style="color:var(--quiet);margin:4px 0 2px">${esc([c.o, c.p, c.c && c.c + ' points'].filter(Boolean).join(' · '))}</div>
    <div style="margin-bottom:12px">${connBadges(c)}</div>`;
  const go = document.createElement('button');
  go.className = 'primary'; go.textContent = 'Drive here';
  go.onclick = () => { M.closePopup(); show($('chargerPanel'), false); routeTo({ lat: c.lat, lng: c.lng, name: c.n }); };
  el.appendChild(go);
  M.popup(c, el);
}

async function renderChargers() {
  $('chargerMapBtn').textContent = chargersOn ? 'Hide on map' : 'Show on map';
  const panelOpen = !$('chargerPanel').classList.contains('hidden');
  if (!chargersOn && !panelOpen) return M.setChargers([], showCharger);
  try {
    const list = await loadChargers();
    M.setChargers(list.filter(c => passes(c)), showCharger);
    if (panelOpen) renderChargerPanel(list);
  } catch { toast('Couldn’t load chargers'); }
}

function renderChargerPanel(list) {
  const f = chargerFilter;
  const chip = (label, on, onClick) => {
    const b = document.createElement('button');
    b.className = 'chip' + (on ? ' on' : ''); b.textContent = label; b.onclick = onClick;
    return b;
  };
  const setF = patch => { chargerFilter = { ...chargerFilter, ...patch }; store.set('chargerFilter', chargerFilter); renderChargers(); };

  // Connectors actually present, then operators by number of stations.
  const conns = CONNECTORS.filter(k => list.some(c => c.s.includes(k)));
  const ops = Object.entries(list.reduce((m, c) => (m[opOf(c)] = (m[opOf(c)] || 0) + 1, m), {}))
    .sort((a, b) => (a[0] === 'Other') - (b[0] === 'Other') || b[1] - a[1]).map(([o]) => o);

  const cc = $('connChips'); cc.innerHTML = '<div class="chipLabel">Connector</div>';
  cc.append(chip('Any', !f.conn, () => setF({ conn: '' })), ...conns.map(k => chip(k, f.conn === k, () => setF({ conn: k }))));
  if (f.conn) cc.append(chip('+ not listed', f.unknown, () => setF({ unknown: !f.unknown })));
  const oc = $('opChips'); oc.innerHTML = '<div class="chipLabel">Operator</div>';
  oc.append(chip('All', !f.op, () => setF({ op: '' })), ...ops.map(o => chip(o, f.op === o, () => setF({ op: o }))));

  const here = pos || M.center();
  const shown = list.filter(c => passes(c)).sort((a, b) => dist(here, a) - dist(here, b)).slice(0, 40);
  const box = $('chargerList'); box.innerHTML = '';
  if (!shown.length) {
    const unknown = list.filter(c => !c.s.length && passes(c, { ...f, conn: '' })).length;
    box.innerHTML = `<div class="res note">No station lists ${esc(f.conn || 'that')} yet${unknown && f.conn ? ` — ${unknown} don’t list their connectors; tap “+ not listed” to include them` : ''}.</div>`;
  }
  for (const c of shown) {
    const div = document.createElement('div');
    div.className = 'res';
    div.innerHTML = `<b>⚡ ${esc(c.n)}</b><span>${esc([c.o, c.p, fmtDist(dist(here, c))].filter(Boolean).join(' · '))}</span><div>${connBadges(c)}</div>`;
    div.onclick = () => { setFollow(false); M.jump(c, { zoom: 16 }); showCharger(c); };
    box.appendChild(div);
  }
}

$('chargersFab').onclick = () => {
  const open = $('chargerPanel').classList.contains('hidden');
  show($('chargerPanel'), open);
  show($('search'), !open && !route);
  renderChargers();
};
$('chargerClose').onclick = () => { show($('chargerPanel'), false); show($('search'), !route); renderChargers(); };
$('chargerMapBtn').onclick = () => { chargersOn = !chargersOn; store.set('chargers', chargersOn); renderChargers(); };
renderChargers();

/** Drives the current route at 50 km/h — for testing at a desk or parked. */
function toggleSim() {
  if (sim) {
    clearInterval(sim.timer); sim = null;
    $('simBtn').textContent = 'Simulate drive';
    return;
  }
  if (!route) return toast('Choose a destination first');
  sim = { along: pos ? locate(route, pos).along : 0, speed: 14 };
  $('simBtn').textContent = 'Stop simulation';
  $('menu').classList.add('hidden');
  const tick = () => {
    if (!route) return;
    sim.along = Math.min(route.total, sim.along + sim.speed);
    const p = pointAt(route, sim.along), ahead = pointAt(route, sim.along + 15);
    onFix({ lat: p.lat, lng: p.lng, speed: sim.speed, course: bearing(p, ahead), acc: 5, ts: Date.now(), src: 'sim' });
  };
  tick();
  sim.timer = setInterval(tick, 1000);
}
$('simBtn').onclick = toggleSim;

// ---------------------------------------------------------------- mirror mode
// The car's browser refuses private addresses, so the iPhone can't serve its screen over the
// hotspot. Instead the broadcast extension sends H.264 video (or JPEGs) through a small
// Cloudflare relay; this page decodes it with WebCodecs and draws it on a canvas.
//
// Binary messages: [kind:1][timestamp ms:4 BE][payload]  kind 1 = key frame, 2 = delta
// frame (both Annex B H.264), 3 = JPEG. Text messages are small JSON control messages.
const RELAY = 'wss://teslanav-relay.hakob-hakobyan173.workers.dev/ws';
const canvas = $('mirrorCanvas'), ctx = canvas.getContext('2d');
let ws = null, decoder = null, reconnectTimer = null;
let rotation = 0, needKey = true, gotFrame = false, phoneOnline = false, decoderCodec = '';
const wantsH264 = 'VideoDecoder' in window && 'EncodedVideoChunk' in window;

const pairCode = () => store.get('pair', '');

function mirrorHint(title) {
  show($('mirrorHint'), !!title);
  if (title) $('mirrorHintTitle').textContent = title;
}

function setMode(m) {
  if (m === 'mirror' && !pairCode()) return askPair(() => setMode('mirror'));
  mode = m;
  store.set('mode', m);
  show($('mirror'), m === 'mirror');
  if (m === 'mirror') {
    if ('speechSynthesis' in window) speechSynthesis.cancel();
    gotFrame = false;
    mirrorHint('Connecting…');
    mirrorConnect();
  } else {
    mirrorDisconnect();
    if (follow) followCar();
  }
}

function mirrorConnect() {
  mirrorDisconnect();
  const sock = new WebSocket(`${RELAY}?room=${encodeURIComponent(pairCode())}&role=car`);
  sock.binaryType = 'arraybuffer';
  sock.onopen = () => sock.send(JSON.stringify({ type: 'want', format: wantsH264 ? 'h264' : 'jpeg' }));
  sock.onmessage = e => typeof e.data === 'string' ? onControl(JSON.parse(e.data)) : onMedia(e.data);
  sock.onclose = () => {
    if (ws !== sock) return;
    ws = null;
    if (mode === 'mirror') {
      mirrorHint('Reconnecting…');
      reconnectTimer = setTimeout(mirrorConnect, 2000);
    }
  };
  ws = sock;
}

function mirrorDisconnect() {
  clearTimeout(reconnectTimer);
  if (ws) { const old = ws; ws = null; old.close(); }
  if (decoder) { try { decoder.close(); } catch {} decoder = null; }
  decoderCodec = '';
  needKey = true;
}

function send(obj) { if (ws && ws.readyState === 1) ws.send(JSON.stringify(obj)); }

function onControl(msg) {
  if (msg.type === 'phone') {
    phoneOnline = msg.online;
    if (!msg.online) { gotFrame = false; mirrorHint('Waiting for the iPhone…'); }
    else if (!gotFrame) mirrorHint('iPhone connected — waiting for the screen…');
  } else if (msg.type === 'config') {
    // A rotation-only update must not reset the decoder (that would ask for a key frame,
    // and the phone answers key-frame requests with fresh frames, not a new config).
    rotation = msg.rotation || 0;
    if (wantsH264 && msg.codec && (msg.codec !== decoderCodec || !decoder)) configureDecoder(msg.codec);
  }
}

async function configureDecoder(codec) {
  const config = { codec, optimizeForLatency: true };
  try {
    const { supported } = await VideoDecoder.isConfigSupported(config);
    if (!supported) throw new Error('unsupported');
  } catch {
    // This browser can't decode the stream: ask the phone for JPEGs instead.
    return send({ type: 'want', format: 'jpeg' });
  }
  if (decoder) { try { decoder.close(); } catch {} }
  decoder = new VideoDecoder({
    output: frame => { draw(frame, frame.displayWidth, frame.displayHeight); frame.close(); },
    error: () => { decoder = null; decoderCodec = ''; needKey = true; send({ type: 'keyframe' }); },
  });
  decoder.configure(config);
  decoderCodec = codec;
  needKey = true;
  send({ type: 'keyframe' });
}

function onMedia(buf) {
  const bytes = new Uint8Array(buf);
  const kind = bytes[0];
  const ts = new DataView(buf).getUint32(1);
  const payload = bytes.subarray(5);
  if (kind === 3) {
    createImageBitmap(new Blob([payload], { type: 'image/jpeg' }))
      .then(bmp => { draw(bmp, bmp.width, bmp.height); bmp.close(); })
      .catch(() => {});
    return;
  }
  if (!decoder || decoder.state !== 'configured') return;
  if (needKey && kind !== 1) return;
  // Falling behind: drop what's queued and start again from the next key frame.
  if (decoder.decodeQueueSize > 6) { needKey = true; send({ type: 'keyframe' }); return; }
  needKey = false;
  try {
    decoder.decode(new EncodedVideoChunk({ type: kind === 1 ? 'key' : 'delta', timestamp: ts * 1000, data: payload }));
  } catch {
    needKey = true; send({ type: 'keyframe' });
  }
}

/** Draw a frame to fill the screen without cropping, honouring the phone's rotation. */
function draw(src, w, h) {
  const dpr = window.devicePixelRatio || 1;
  const cw = Math.round(canvas.clientWidth * dpr), ch = Math.round(canvas.clientHeight * dpr);
  if (canvas.width !== cw || canvas.height !== ch) { canvas.width = cw; canvas.height = ch; }
  const turned = rotation === 90 || rotation === 270;
  const sw = turned ? h : w, sh = turned ? w : h;
  // Fit shows the whole phone screen; Fill covers the car screen and crops the overflow.
  const scale = fill ? Math.max(cw / sw, ch / sh) : Math.min(cw / sw, ch / sh);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cw, ch);
  ctx.translate(cw / 2, ch / 2);
  ctx.rotate(rotation * Math.PI / 180);
  ctx.drawImage(src, -w * scale / 2, -h * scale / 2, w * scale, h * scale);
  if (!gotFrame) { gotFrame = true; mirrorHint(''); }
}

function askPair(then) {
  $('pairCode').value = pairCode();
  show($('pair'), true);
  $('pairCode').focus();
  $('pairOk').onclick = () => {
    const code = $('pairCode').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
    if (code.length !== 8) return toast('The code has 8 letters and digits');
    store.set('pair', code);
    show($('pair'), false);
    if (then) then();
  };
}
$('pairCode').addEventListener('keydown', e => { if (e.key === 'Enter') $('pairOk').click(); });
$('pairCancel').onclick = () => show($('pair'), false);
$('pairBtn').onclick = () => { $('menu').classList.add('hidden'); askPair(() => { if (mode === 'mirror') mirrorConnect(); }); };
$('mirrorBtn').onclick = () => setMode('mirror');
$('mirrorBack').onclick = () => { if (document.fullscreenElement) document.exitFullscreen().catch(() => {}); setMode('map'); };

let fill = store.get('fill', false);
function renderFit() { $('fitBtn').textContent = fill ? '⤡  Fit' : '⤢  Fill'; }
$('fitBtn').onclick = () => { fill = !fill; store.set('fill', fill); renderFit(); canvas.width = 0; send({ type: 'keyframe' }); };
renderFit();

// Full screen hides the car's side panel and the browser bar. Not every car browser allows it
// (some only while parked); the car's own ⛶ button next to the address bar also helps.
$('fullBtn').onclick = () => {
  const el = $('mirror');
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req) return toast('Use the ⛶ button next to the address bar');
  Promise.resolve(req.call(el)).catch(() => toast('Full screen isn’t allowed here — try the ⛶ button next to the address bar'));
};
document.addEventListener('fullscreenchange', () => { canvas.width = 0; send({ type: 'keyframe' }); });

// The buttons fade out after a few seconds so they don't cover the phone screen; tap to show.
let idleTimer;
function wake() {
  $('mirror').classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => $('mirror').classList.add('idle'), 4000);
}
$('mirror').addEventListener('pointerdown', wake);
$('mirrorBtn').addEventListener('click', wake);
window.addEventListener('resize', () => { if (canvas.width) { canvas.width = 0; } });

// ---------------------------------------------------------------- start
// ?to=lat,lng[&name=…] opens straight into navigation (a shareable destination link);
// adding &sim drives it with the simulator.
const to = (params.get('to') || '').split(',').map(Number);
dest = to.length === 2 && to.every(Number.isFinite)
  ? { lat: to[0], lng: to[1], name: params.get('name') || 'Destination' }
  : store.get('dest', null);      // otherwise resume navigation after a reload
detectSource();
if (store.get('mode', 'map') === 'mirror' && pairCode()) setMode('mirror');
// A ?to= link opened without a GPS fix (e.g. testing at a desk): route from the map centre.
if (params.has('to') && dest) setTimeout(() => { if (!pos && !route) routeTo(dest); }, 3000);
})();
</script>
